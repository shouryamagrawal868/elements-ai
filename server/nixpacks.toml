[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "python311", "python311Packages.pip", "python311Packages.numpy", "python311Packages.scipy", "python311Packages.librosa", "python311Packages.psycopg2", "ffmpeg", "chromaprint"]

[phases.install]
cmds = [
  "npm install"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "node dist/server.js"