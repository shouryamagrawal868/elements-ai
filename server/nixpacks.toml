providers = ["node"]

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "python311",
  "python311Packages.pip",
  "python311Packages.librosa",
  "python311Packages.numpy",
  "python311Packages.scipy",
  "python311Packages.soundfile",
  "ffmpeg",
  "chromaprint",
  "libsndfile"
]

[phases.install]
cmds = [
  "npm ci"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npx tsc"
]

[start]
cmd = "node dist/server.js"