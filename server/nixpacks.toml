[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "python311Full", "ffmpeg", "chromaprint"]

[phases.install]
cmds = [
  "npm install",
  "python3 -m pip install numpy==1.26.4 scipy librosa psycopg2-binary --break-system-packages"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "node dist/server.js"