[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "python311", "python311Packages.pip", "python311Packages.virtualenv", "ffmpeg", "chromaprint"]

[phases.install]
cmds = [
  "npm install",
  "python3 -m virtualenv /app/venv",
  "/app/venv/bin/pip install numpy==1.26.4 scipy librosa psycopg2-binary"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "node dist/server.js"