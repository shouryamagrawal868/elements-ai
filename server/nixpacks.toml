providers = ["node"]

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "python311",
  "python311Packages.pip",
  "ffmpeg",
  "chromaprint",
  "libsndfile"
]

[phases.install]
cmds = [
  "pip install --no-cache-dir librosa numpy scipy soundfile",
  "npm ci"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npx tsc"
]

[start]
cmd = "node dist/server.js"