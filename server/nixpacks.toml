[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "python311", "python311Packages.pip", "python311Packages.numpy", "python311Packages.scipy", "ffmpeg", "chromaprint", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "npm install",
  "pip3 install librosa psycopg2-binary --break-system-packages --no-deps",
  "pip3 install audioread decorator joblib lazy-loader msgpack pooch scikit-learn soundfile soxr typing-extensions --break-system-packages"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "node dist/server.js"