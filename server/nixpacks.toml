providers = ["node"]

[variables]
PATH = "/app/.venv/bin:$PATH"
PRISMA_SKIP_POSTINSTALL = "1"

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "python311",
  "python311Packages.pip",
  "ffmpeg",
  "chromaprint",
  "libsndfile",
  "bash",
  "coreutils"
]

[phases.install]
cmds = [
  "python3 -m venv /app/.venv",
  "/app/.venv/bin/pip install --no-cache-dir librosa numpy scipy soundfile",
  "npm ci --ignore-scripts"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npx tsc --skipLibCheck"
]

[start]
cmd = "node dist/server.js"